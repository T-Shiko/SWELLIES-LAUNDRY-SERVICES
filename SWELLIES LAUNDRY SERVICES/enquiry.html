<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry - Swellies Laundry Services</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Enquiry</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="services.html">Services</a>
      <a href="enquiry.html">Enquiry</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Book a Laundry Service</h2>
      <p>Please fill out the form below to request a pickup, delivery, or ask us a question.</p>
      
      <form action="#" method="post">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="service">Service Required:</label><br>
        <select id="service" name="service" required>
          <option value="">-- Select a Service --</option>
          <option value="washing">Washing & Drying</option>
          <option value="ironing">Ironing</option>
          <option value="folding">Folding</option>
          <option value="delivery">Collection & Delivery</option>
        </select><br><br>

        <label for="date">Preferred Date:</label><br>
        <input type="date" id="date" name="date"><br><br>

        <label for="message">Additional Notes:</label><br>
        <textarea id="message" name="message" rows="4"></textarea><br><br>

        <button type="submit">Submit Enquiry</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Swellies Laundry Services</p>
  </footer>
</body>
</html>
